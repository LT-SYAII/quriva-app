name: Native Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#native-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="native"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > native-android/app/upload-keystore.jks
          cat > native-android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build native release APKs
        working-directory: native-android
        run: ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-apks
          path: native-android/app/build/outputs/apk/release/*.apk

      - name: Publish release APKs
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          files: native-android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
