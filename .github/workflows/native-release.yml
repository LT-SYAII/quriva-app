name: Native Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build native release APKs
        working-directory: native-android
        run: ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: native-apks
          path: native-android/app/build/outputs/apk/release/*.apk
