name: Native Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#native-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.1.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > native-android/app/upload-keystore.jks
            cat > native-android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
          else
            echo "No signing secrets; building with debug signing fallback."
          fi

      - name: Build native release APKs
        working-directory: native-android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: List APKs
        run: ls -lh native-android/app/build/outputs/apk/release || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-apks-${{ steps.meta.outputs.version }}
          path: native-android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Quriva Native v${{ steps.meta.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: native-android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
